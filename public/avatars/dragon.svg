<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g id="avatar-bg">
    <circle cx="100" cy="100" r="100" fill="#E8F5E9"/>
  </g>
  <!-- Body / neck -->
  <g id="avatar-body">
    <ellipse cx="100" cy="190" rx="44" ry="20" fill="#4CC97C"/>
    <ellipse cx="100" cy="182" rx="28" ry="14" fill="#3AB56A"/>
  </g>
  <!-- Horns and fin -->
  <g id="avatar-extras">
    <!-- Left horn -->
    <path d="M74 70 L68 40 L80 64" fill="#FFD23F"/>
    <!-- Right horn -->
    <path d="M126 70 L132 40 L120 64" fill="#FFD23F"/>
    <!-- Head fin / ridge detail -->
    <path d="M86 64 Q100 54 114 64" stroke="#3AB56A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Smoke puff from mouth corner -->
    <circle cx="122" cy="148" r="6" fill="#E8F4FF" fill-opacity="0.8"/>
    <circle cx="130" cy="142" r="5" fill="#E8F4FF" fill-opacity="0.6"/>
    <circle cx="137" cy="136" r="4" fill="#E8F4FF" fill-opacity="0.4"/>
  </g>
  <!-- Head -->
  <g id="avatar-head">
    <ellipse cx="100" cy="114" rx="56" ry="52" fill="#4CC97C"/>
    <!-- Scale pattern on cheeks -->
    <path d="M62 110 Q66 104 72 110 Q78 116 72 122" stroke="#3AB56A" stroke-width="1.5" fill="none"/>
    <path d="M66 120 Q70 114 76 120 Q82 126 76 132" stroke="#3AB56A" stroke-width="1.5" fill="none"/>
    <path d="M138 110 Q134 104 128 110 Q122 116 128 122" stroke="#3AB56A" stroke-width="1.5" fill="none"/>
    <path d="M134 120 Q130 114 124 120 Q118 126 124 132" stroke="#3AB56A" stroke-width="1.5" fill="none"/>
    <!-- Muzzle area -->
    <ellipse cx="100" cy="134" rx="28" ry="18" fill="#3AB56A" fill-opacity="0.4"/>
    <!-- Nostrils -->
    <ellipse cx="92" cy="136" rx="4" ry="3" fill="#2A9456"/>
    <ellipse cx="108" cy="136" rx="4" ry="3" fill="#2A9456"/>
  </g>
  <!-- Eyes — golden -->
  <g id="avatar-eyes">
    <circle cx="82" cy="108" r="14" fill="#FFD23F"/>
    <ellipse cx="82" cy="108" rx="6" ry="10" fill="#1A2B3C"/>
    <circle cx="85" cy="104" r="4" fill="white"/>
    <circle cx="86" cy="103" r="2" fill="white" fill-opacity="0.7"/>
    <circle cx="118" cy="108" r="14" fill="#FFD23F"/>
    <ellipse cx="118" cy="108" rx="6" ry="10" fill="#1A2B3C"/>
    <circle cx="121" cy="104" r="4" fill="white"/>
    <circle cx="122" cy="103" r="2" fill="white" fill-opacity="0.7"/>
  </g>
  <!-- Mouth — friendly with tiny fang + smoke -->
  <g id="avatar-mouth">
    <path d="M84 144 Q100 156 116 144" stroke="#2A9456" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- One little fang -->
    <path d="M104 150 L106 158" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
