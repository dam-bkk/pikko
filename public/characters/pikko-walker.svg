<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" class="pikko-character pikko-walker">
  <!-- Pikko Walker — genderless path traveler, works at 40x60px minimum -->

  <!-- Backpack -->
  <g id="backpack">
    <rect x="52" y="38" width="22" height="28" rx="5" fill="#B8E5C8"/>
    <!-- Backpack straps -->
    <path d="M52 42 Q48 50 52 58" stroke="#4CC97C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Front pocket -->
    <rect x="55" y="48" width="16" height="12" rx="3" fill="#4CC97C" fill-opacity="0.5"/>
    <circle cx="63" cy="54" r="2" fill="#4CC97C"/>
  </g>

  <!-- Body -->
  <g id="body">
    <!-- Torso / shirt — cream with orange accent -->
    <rect x="34" y="56" width="36" height="34" rx="8" fill="#FFF9EE"/>
    <!-- Orange collar stripe -->
    <rect x="34" y="56" width="36" height="8" rx="8" fill="#FF6635" fill-opacity="0.6"/>
  </g>

  <!-- Legs (walking pose — one leg forward) -->
  <g id="legs">
    <!-- Walking state 1: left leg back, right leg forward -->
    <!-- Left leg (back) -->
    <rect x="36" y="88" width="14" height="30" rx="6" fill="#3BAFDA" transform="rotate(12 43 103)"/>
    <!-- Left shoe -->
    <ellipse cx="38" cy="118" rx="9" ry="5" fill="#1A2B3C" transform="rotate(12 38 118)"/>
    <!-- Right leg (forward) -->
    <rect x="52" y="88" width="14" height="30" rx="6" fill="#3BAFDA" transform="rotate(-10 59 103)"/>
    <!-- Right shoe -->
    <ellipse cx="64" cy="116" rx="9" ry="5" fill="#1A2B3C" transform="rotate(-10 64 116)"/>
  </g>

  <!-- Left arm (swing back) -->
  <g id="arm-left">
    <rect x="18" y="60" width="16" height="10" rx="5" fill="#FFF9EE" transform="rotate(25 26 65)"/>
    <!-- Hand -->
    <circle cx="18" cy="72" r="6" fill="#E8B98A"/>
  </g>

  <!-- Right arm (holding book, swing forward) -->
  <g id="arm-right">
    <rect x="66" y="60" width="16" height="10" rx="5" fill="#FFF9EE" transform="rotate(-20 74 65)"/>
    <!-- Tiny book in hand -->
    <rect x="76" y="50" width="14" height="18" rx="2" fill="#FFD23F"/>
    <rect x="76" y="50" width="3" height="18" rx="1" fill="#FF8C35"/>
  </g>

  <!-- Head -->
  <g id="head">
    <ellipse cx="52" cy="34" rx="28" ry="28" fill="#E8B98A"/>
    <!-- Simple dark hair -->
    <ellipse cx="52" cy="12" rx="26" ry="12" fill="#1A2B3C"/>
    <!-- Ears -->
    <ellipse cx="24" cy="34" rx="6" ry="8" fill="#E8B98A"/>
    <ellipse cx="80" cy="34" rx="6" ry="8" fill="#E8B98A"/>
    <!-- Cheek blush -->
    <ellipse cx="38" cy="40" rx="7" ry="4" fill="#FFB5A0" fill-opacity="0.4"/>
    <ellipse cx="66" cy="40" rx="7" ry="4" fill="#FFB5A0" fill-opacity="0.4"/>
  </g>

  <!-- Eyes — cheerful -->
  <g id="eyes">
    <circle cx="43" cy="33" r="7" fill="white"/>
    <circle cx="61" cy="33" r="7" fill="white"/>
    <circle cx="43" cy="34" r="4" fill="#1A2B3C"/>
    <circle cx="61" cy="34" r="4" fill="#1A2B3C"/>
    <circle cx="45" cy="31" r="2" fill="white"/>
    <circle cx="63" cy="31" r="2" fill="white"/>
  </g>

  <!-- Mouth — cheerful smile -->
  <g id="mouth">
    <path d="M44 44 Q52 50 60 44" stroke="#C09070" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
