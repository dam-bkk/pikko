<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g id="avatar-bg">
    <circle cx="100" cy="100" r="100" fill="#E8F4FF"/>
  </g>
  <!-- Body / t-shirt (blue striped) -->
  <g id="avatar-body">
    <ellipse cx="100" cy="190" rx="50" ry="22" fill="#3BAFDA"/>
    <line x1="58" y1="182" x2="142" y2="182" stroke="white" stroke-width="4" stroke-opacity="0.6"/>
    <line x1="55" y1="190" x2="145" y2="190" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
    <!-- Peace sign hand -->
    <g transform="translate(138,158) rotate(-10)">
      <ellipse cx="0" cy="8" rx="10" ry="14" fill="#C99670"/>
      <line x1="-3" y1="0" x2="-6" y2="-14" stroke="#C99670" stroke-width="6" stroke-linecap="round"/>
      <line x1="3" y1="0" x2="7" y2="-14" stroke="#C99670" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Hair — curly -->
  <g id="avatar-extras">
    <circle cx="100" cy="80" r="48" fill="#3D2010"/>
    <!-- Curly texture -->
    <circle cx="68" cy="68" r="12" fill="#3D2010"/>
    <circle cx="82" cy="60" r="13" fill="#3D2010"/>
    <circle cx="100" cy="57" r="12" fill="#3D2010"/>
    <circle cx="118" cy="60" r="13" fill="#3D2010"/>
    <circle cx="132" cy="68" r="12" fill="#3D2010"/>
    <!-- Glasses -->
    <rect x="62" y="108" width="28" height="18" rx="8" fill="none" stroke="#1A2B3C" stroke-width="3"/>
    <rect x="110" y="108" width="28" height="18" rx="8" fill="none" stroke="#1A2B3C" stroke-width="3"/>
    <line x1="90" y1="117" x2="110" y2="117" stroke="#1A2B3C" stroke-width="3"/>
    <line x1="50" y1="112" x2="62" y2="114" stroke="#1A2B3C" stroke-width="2.5"/>
    <line x1="138" y1="114" x2="150" y2="112" stroke="#1A2B3C" stroke-width="2.5"/>
  </g>
  <!-- Head -->
  <g id="avatar-head">
    <ellipse cx="100" cy="120" rx="50" ry="52" fill="#C99670"/>
    <ellipse cx="50" cy="120" rx="10" ry="12" fill="#C99670"/>
    <ellipse cx="150" cy="120" rx="10" ry="12" fill="#C99670"/>
  </g>
  <!-- Eyes -->
  <g id="avatar-eyes">
    <circle cx="84" cy="117" r="7" fill="#1A2B3C"/>
    <circle cx="116" cy="117" r="7" fill="#1A2B3C"/>
    <circle cx="86" cy="114" r="2.5" fill="white"/>
    <circle cx="118" cy="114" r="2.5" fill="white"/>
  </g>
  <!-- Mouth — wide smile showing teeth -->
  <g id="avatar-mouth">
    <path d="M84 136 Q100 150 116 136" fill="#C09070"/>
    <path d="M84 136 Q100 145 116 136" fill="white"/>
    <path d="M84 136 Q100 150 116 136" stroke="#A07050" stroke-width="1.5" fill="none"/>
  </g>
</svg>
