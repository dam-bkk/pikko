<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g id="avatar-bg">
    <circle cx="100" cy="100" r="100" fill="#FFE0EC"/>
  </g>
  <!-- Body / pink t-shirt -->
  <g id="avatar-body">
    <ellipse cx="100" cy="190" rx="48" ry="22" fill="#FF8C9F"/>
    <!-- White flower -->
    <circle cx="100" cy="182" r="6" fill="white"/>
    <circle cx="93" cy="177" r="4" fill="white"/>
    <circle cx="107" cy="177" r="4" fill="white"/>
    <circle cx="93" cy="187" r="4" fill="white"/>
    <circle cx="107" cy="187" r="4" fill="white"/>
    <circle cx="100" cy="182" r="4" fill="#FFD23F"/>
    <!-- Hands on cheeks (kawaii) -->
    <ellipse cx="46" cy="140" rx="14" ry="10" fill="#E8B98A"/>
    <ellipse cx="154" cy="140" rx="14" ry="10" fill="#E8B98A"/>
  </g>
  <!-- Hair — pigtails -->
  <g id="avatar-extras">
    <!-- Main hair -->
    <ellipse cx="100" cy="82" rx="52" ry="30" fill="#1A0845"/>
    <!-- Left pigtail -->
    <ellipse cx="52" cy="100" rx="16" ry="28" fill="#1A0845"/>
    <!-- Left ribbon -->
    <ellipse cx="52" cy="74" rx="14" ry="8" fill="#FFD23F"/>
    <circle cx="52" cy="74" r="5" fill="#FF6635"/>
    <!-- Right pigtail -->
    <ellipse cx="148" cy="100" rx="16" ry="28" fill="#1A0845"/>
    <!-- Right ribbon -->
    <ellipse cx="148" cy="74" rx="14" ry="8" fill="#FFD23F"/>
    <circle cx="148" cy="74" r="5" fill="#FF6635"/>
  </g>
  <!-- Head -->
  <g id="avatar-head">
    <ellipse cx="100" cy="118" rx="50" ry="52" fill="#E8B98A"/>
    <!-- Cheek blush -->
    <ellipse cx="70" cy="130" rx="14" ry="8" fill="#FFB5A0" fill-opacity="0.55"/>
    <ellipse cx="130" cy="130" rx="14" ry="8" fill="#FFB5A0" fill-opacity="0.55"/>
    <!-- Ears -->
    <ellipse cx="50" cy="118" rx="9" ry="11" fill="#E8B98A"/>
    <ellipse cx="150" cy="118" rx="9" ry="11" fill="#E8B98A"/>
  </g>
  <!-- Eyes — big and curious -->
  <g id="avatar-eyes">
    <circle cx="84" cy="112" r="12" fill="#1A2B3C"/>
    <circle cx="116" cy="112" r="12" fill="#1A2B3C"/>
    <circle cx="88" cy="108" r="4.5" fill="white"/>
    <circle cx="120" cy="108" r="4.5" fill="white"/>
    <circle cx="89" cy="107" r="2" fill="white" fill-opacity="0.7"/>
    <circle cx="121" cy="107" r="2" fill="white" fill-opacity="0.7"/>
  </g>
  <!-- Mouth — open smile -->
  <g id="avatar-mouth">
    <path d="M86 134 Q100 148 114 134" fill="#C09070"/>
    <path d="M86 134 Q100 144 114 134" fill="white"/>
    <path d="M86 134 Q100 148 114 134" stroke="#A07050" stroke-width="1.5" fill="none"/>
  </g>
</svg>
