<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" class="pikko-character pikko-nong">
  <!-- Body -->
  <g id="body">
    <!-- Yellow t-shirt -->
    <rect x="60" y="150" width="80" height="70" rx="10" fill="#FFD23F"/>
    <!-- White elephant patch on shirt -->
    <ellipse cx="100" cy="168" rx="12" ry="10" fill="white" fill-opacity="0.85"/>
    <path d="M94 164 Q100 158 106 164 Q108 170 106 174 Q100 178 94 174 Q92 170 94 164Z" fill="#E8E8E8"/>
    <path d="M96 174 Q94 180 96 182" stroke="#E8E8E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Blue shorts -->
    <rect x="62" y="215" width="76" height="48" rx="8" fill="#3BAFDA"/>
    <!-- Shorts center line -->
    <line x1="100" y1="215" x2="100" y2="263" stroke="#2E9BC2" stroke-width="2"/>
    <!-- Left leg -->
    <rect x="62" y="250" width="32" height="36" rx="8" fill="#E8B98A"/>
    <!-- Right leg -->
    <rect x="106" y="250" width="32" height="36" rx="8" fill="#E8B98A"/>
    <!-- Brown sandals left -->
    <ellipse cx="78" cy="288" rx="18" ry="8" fill="#C09050"/>
    <!-- Brown sandals right -->
    <ellipse cx="122" cy="288" rx="18" ry="8" fill="#C09050"/>
    <!-- Sandal straps -->
    <rect x="68" y="282" width="20" height="4" rx="2" fill="#A07840"/>
    <rect x="112" y="282" width="20" height="4" rx="2" fill="#A07840"/>
  </g>
  <!-- Arms -->
  <g id="left-arm">
    <rect x="28" y="155" width="32" height="18" rx="9" fill="#E8B98A"/>
    <!-- Hand -->
    <circle cx="22" cy="164" r="10" fill="#E8B98A"/>
  </g>
  <g id="right-arm">
    <rect x="140" y="155" width="32" height="18" rx="9" fill="#E8B98A"/>
    <!-- Hand -->
    <circle cx="178" cy="164" r="10" fill="#E8B98A"/>
  </g>
  <!-- Head -->
  <g id="head">
    <ellipse cx="100" cy="110" rx="52" ry="52" fill="#E8B98A"/>
    <!-- Ears -->
    <ellipse cx="48" cy="110" rx="10" ry="12" fill="#E8B98A"/>
    <ellipse cx="152" cy="110" rx="10" ry="12" fill="#E8B98A"/>
    <!-- Inner ear -->
    <ellipse cx="48" cy="110" rx="5" ry="7" fill="#D4A070" fill-opacity="0.5"/>
    <ellipse cx="152" cy="110" rx="5" ry="7" fill="#D4A070" fill-opacity="0.5"/>
    <!-- Cowlick hair — black, right side -->
    <ellipse cx="100" cy="66" rx="48" ry="22" fill="#1A2B3C"/>
    <path d="M122 64 Q136 52 130 44 Q142 50 134 62" fill="#1A2B3C"/>
    <!-- Eyebrows -->
    <path d="M76 96 Q84 92 88 96" stroke="#1A2B3C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M112 96 Q116 92 124 96" stroke="#1A2B3C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <ellipse cx="70" cy="122" rx="12" ry="7" fill="#FFB5A0" fill-opacity="0.35"/>
    <ellipse cx="130" cy="122" rx="12" ry="7" fill="#FFB5A0" fill-opacity="0.35"/>
  </g>
  <!-- Eyes -->
  <g id="eyes">
    <circle cx="84" cy="110" r="12" fill="white"/>
    <circle cx="116" cy="110" r="12" fill="white"/>
    <circle cx="84" cy="112" r="7" fill="#1A2B3C"/>
    <circle cx="116" cy="112" r="7" fill="#1A2B3C"/>
    <!-- Shine -->
    <circle cx="87" cy="108" r="3" fill="white"/>
    <circle cx="119" cy="108" r="3" fill="white"/>
  </g>
  <!-- Mouth -->
  <g id="mouth">
    <path d="M88 132 Q100 142 112 132" stroke="#C09070" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Small smile fill -->
    <path d="M88 132 Q100 144 112 132 Q100 140 88 132Z" fill="#E8896A" fill-opacity="0.4"/>
  </g>
</svg>
