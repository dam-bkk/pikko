<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" class="pikko-character pikko-ploy">
  <!-- Body -->
  <g id="body">
    <!-- Pink t-shirt with jasmine flower -->
    <rect x="58" y="150" width="82" height="68" rx="10" fill="#FF8C9F"/>
    <!-- Jasmine flower patch -->
    <circle cx="100" cy="170" r="6" fill="white" fill-opacity="0.9"/>
    <circle cx="94" cy="166" r="4" fill="white" fill-opacity="0.8"/>
    <circle cx="106" cy="166" r="4" fill="white" fill-opacity="0.8"/>
    <circle cx="108" cy="174" r="4" fill="white" fill-opacity="0.7"/>
    <circle cx="92" cy="174" r="4" fill="white" fill-opacity="0.7"/>
    <circle cx="100" cy="170" r="3" fill="#FFD23F"/>
    <!-- White skirt with sage trim -->
    <rect x="58" y="212" width="82" height="52" rx="8" fill="white"/>
    <!-- Sage trim at bottom -->
    <rect x="58" y="252" width="82" height="12" rx="8" fill="#B8E5C8"/>
    <!-- Left leg -->
    <rect x="62" y="252" width="28" height="36" rx="8" fill="#F5D5B0"/>
    <!-- Right leg -->
    <rect x="110" y="252" width="28" height="36" rx="8" fill="#F5D5B0"/>
    <!-- White sneakers left -->
    <ellipse cx="76" cy="290" rx="18" ry="7" fill="white"/>
    <rect x="64" y="284" width="24" height="8" rx="4" fill="white"/>
    <rect x="64" y="284" width="24" height="3" rx="2" fill="#E0E0E0"/>
    <!-- White sneakers right -->
    <ellipse cx="124" cy="290" rx="18" ry="7" fill="white"/>
    <rect x="112" y="284" width="24" height="8" rx="4" fill="white"/>
    <rect x="112" y="284" width="24" height="3" rx="2" fill="#E0E0E0"/>
  </g>
  <!-- Left arm — waving -->
  <g id="left-arm">
    <rect x="28" y="152" width="30" height="16" rx="8" fill="#F5D5B0" transform="rotate(-30 43 160)"/>
    <circle cx="22" cy="146" r="10" fill="#F5D5B0"/>
    <!-- Waving fingers hint -->
    <path d="M16 140 Q18 135 22 138" stroke="#E8C0A0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M22 138 Q24 133 27 136" stroke="#E8C0A0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M27 136 Q30 132 33 136" stroke="#E8C0A0" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Right arm — holding book -->
  <g id="right-arm">
    <rect x="142" y="155" width="30" height="16" rx="8" fill="#F5D5B0"/>
    <circle cx="178" cy="163" r="10" fill="#F5D5B0"/>
    <!-- Small book in hand -->
    <rect x="166" y="152" width="22" height="28" rx="3" fill="#3BAFDA"/>
    <rect x="166" y="152" width="4" height="28" rx="2" fill="#2A9BC2"/>
    <line x1="172" y1="158" x2="185" y2="158" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="172" y1="163" x2="185" y2="163" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="172" y1="168" x2="185" y2="168" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Head -->
  <g id="head">
    <ellipse cx="100" cy="108" rx="52" ry="50" fill="#F5D5B0"/>
    <!-- Ears -->
    <ellipse cx="48" cy="108" rx="10" ry="12" fill="#F5D5B0"/>
    <ellipse cx="152" cy="108" rx="10" ry="12" fill="#F5D5B0"/>
    <ellipse cx="48" cy="108" rx="5" ry="7" fill="#DDB490" fill-opacity="0.5"/>
    <ellipse cx="152" cy="108" rx="5" ry="7" fill="#DDB490" fill-opacity="0.5"/>
    <!-- Pigtails base hair -->
    <ellipse cx="100" cy="66" rx="48" ry="22" fill="#1A2B3C"/>
    <!-- Left pigtail with pink ribbon -->
    <path d="M52 72 Q28 56 26 80 Q28 100 52 96" fill="#1A2B3C"/>
    <circle cx="52" cy="72" r="8" fill="#FFB5A0"/>
    <path d="M44 68 Q52 72 60 68 M44 76 Q52 72 60 76" stroke="#FF8C9F" stroke-width="2" fill="none"/>
    <!-- Right pigtail with pink ribbon -->
    <path d="M148 72 Q172 56 174 80 Q172 100 148 96" fill="#1A2B3C"/>
    <circle cx="148" cy="72" r="8" fill="#FFB5A0"/>
    <path d="M140 68 Q148 72 156 68 M140 76 Q148 72 156 76" stroke="#FF8C9F" stroke-width="2" fill="none"/>
    <!-- Eyebrows -->
    <path d="M76 94 Q84 90 88 94" stroke="#1A2B3C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M112 94 Q116 90 124 94" stroke="#1A2B3C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <ellipse cx="68" cy="120" rx="12" ry="7" fill="#FFB5A0" fill-opacity="0.4"/>
    <ellipse cx="132" cy="120" rx="12" ry="7" fill="#FFB5A0" fill-opacity="0.4"/>
  </g>
  <!-- Eyes -->
  <g id="eyes">
    <circle cx="84" cy="108" r="12" fill="white"/>
    <circle cx="116" cy="108" r="12" fill="white"/>
    <circle cx="84" cy="110" r="7" fill="#1A2B3C"/>
    <circle cx="116" cy="110" r="7" fill="#1A2B3C"/>
    <!-- Lashes top -->
    <path d="M76 100 Q78 97 80 99" stroke="#1A2B3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M84 98 Q84 95 86 97" stroke="#1A2B3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M108 100 Q110 97 112 99" stroke="#1A2B3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M116 98 Q116 95 118 97" stroke="#1A2B3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Shine -->
    <circle cx="87" cy="106" r="3" fill="white"/>
    <circle cx="119" cy="106" r="3" fill="white"/>
  </g>
  <!-- Mouth — open smile two teeth -->
  <g id="mouth">
    <path d="M86 130 Q100 142 114 130" stroke="#C09070" stroke-width="2" fill="#E8896A" fill-opacity="0.3"/>
    <!-- Two front teeth -->
    <rect x="95" y="130" width="5" height="7" rx="2" fill="white"/>
    <rect x="100" y="130" width="5" height="7" rx="2" fill="white"/>
  </g>
</svg>
